version: '3.8'

# Use this file to run just the database dependency (plus Redis)
# Useful when developing locally with `dotnet run`
#
# Usage: docker-compose -f docker-compose.deps.yml up -d

services:
#if (UseSqlServer)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: starbase-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
#elseif (UsePostgreSql)
  postgres:
    image: postgres:16-alpine
    container_name: starbase-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrong!Passw0rd
      - POSTGRES_DB=Starbase
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
#else
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: starbase-oracle
    environment:
      - ORACLE_PASSWORD=YourStrong!Passw0rd
      - APP_USER=starbase
      - APP_USER_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
#endif

  redis:
    image: redis:7-alpine
    container_name: starbase-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
#if (UseSqlServer)
  sqlserver-data:
#elseif (UsePostgreSql)
  postgres-data:
#else
  oracle-data:
#endif
  redis-data:
